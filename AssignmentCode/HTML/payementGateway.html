<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payfast - Secure Payment below</title>
  <style>
      button {
      background-color: #5e2ced;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      margin-top: 20px;
      cursor: pointer;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      text-align: center;
      padding-top: 50px;
    }
    .payment-box {
      background: white;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
  
  </style>
</head>
<body>
  <div class="payment-box">
    <h2>Payfast</h2>
    <p>Amount: <strong>R999.00</strong></p>
    <p>Confirm you payment below</p>
    <button onclick="completePayment()">Pay Now</button>
  </div>

  <script>
    function completePayment() {
      alert("Payment successful!");
      window.location.href = "homepage.php";
    }
  </script>
</body>
</html>
