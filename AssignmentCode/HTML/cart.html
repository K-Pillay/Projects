<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Cart</title>
  <link rel="stylesheet" href="../CSS/cart.css" />
</head>
<body>
  <div class="cart-container">
    <div class="cart-header">
      <a href="homepage.html" class="back-button">&larr;</a>
      <h2>Your Cart</h2>
      <span class="item-count">(3 Items)</span>
    </div>

    <div class="cart-item">
      <img src="images/iphone.png" alt="Iphone X">
      <div class="item-details">
        <h3>Iphone X</h3>
        <p>R6000</p>
        <p>Quantity: 1</p>
      </div>
      <span class="remove">&times;</span>
    </div>

    <div class="cart-item">
      <img src="images/sample2.jpg" alt="Product">
      <div class="item-details">
        <h3>Product name</h3>
        <p>Product price</p>
        <p>Quantity</p>
      </div>
      <span class="remove">&times;</span>
    </div>

    <div class="cart-item">
      <img src="images/sample3.jpg" alt="Product">
      <div class="item-details">
        <h3>Product name</h3>
        <p>Product price</p>
        <p>Quantity</p>
      </div>
      <span class="remove">&times;</span>
    </div>

    <div class="cart-summary">
      <p><strong>Total Price (incl VAT):</strong> Rxxxx</p>
      <a href="checkout.html" class="checkout-btn">Proceed to checkout</a>
    </div>
  </div>
</body>
</html>
