<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../CSS/Login.css" />
  <script src="../javascript/script.js"></script>

<script>
    function showLoading(){
        //disolayes textafetr successful login
        document.querySelector("button[type='submit']").innerText = "Logging in..."; 
    }
</script>
</head>
<body>
    <div class = "login page">
        <h1>Log into Your account</h1>


    <form action = "../PHP/login.php" method="POST" onsubmit="showLoading()">
        <label>Email</label>
        <input type="email" name = "Email"  placeholder="Enter Email" required/>


        <label>Password</label>
        <div class="password-wrapper">
          <input type="password" name = "Password" placeholder="Enter password" required/>
          <span class="toggle"></span>
        </div>
  

        <div class="form-options">
            <label> <input type = "checkbox"/>Remember me</label>
            <a href = "#"> Forgot Password?</a>
        </div>

        <button type="submit">Login</button>
    
    </form>
    <p class="signup">Dont have an account?<a href = "Register.html"> Register</a></p>
    </div>

    
</body>
</html>
