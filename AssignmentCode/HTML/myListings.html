<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Listings</title>
  <link rel="stylesheet" href="my_listings.css" />
  <style>
    body {
  font-family: Arial, sans-serif;
  margin: 0;
  background-color: #f9f9f9;
}

.container {
  max-width: 400px;
  margin: 0 auto;
  background: #fff;
  height: 100vh;
  border-left: 1px solid #ddd;
  border-right: 1px solid #ddd;
}

.header {
  background-color: #e9ecef;
  padding: 10px;
  display: flex;
  align-items: center;
}

.back-arrow {
  text-decoration: none;
  font-size: 20px;
  margin-right: 10px;
  color: #333;
}

.header h2 {
  font-size: 18px;
  margin: 0;
}

.listing-option {
  padding: 15px 20px;
  border-bottom: 1px solid #ccc;
  background-color: #f8f9fa;
  cursor: pointer;
  font-size: 16px;
}

.listing-option:hover {
  background-color: #e2e6ea;
}
  </style>

</head>
<body>
  <div class="container">
    <div class="header">
      <a href="My Account.html"class="back-arrow">&larr;</a>
      <h2>My Listings</h2>
    </div>

    <div class="listing-option" onclick="window.location.href='allListings.html'">
      All listings
    </div>

    <div class="listing-option" onclick="window.location.href='createListing.html'">
      Create new listing
    </div>
  </div>
</body>
</html>
