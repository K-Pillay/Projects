<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!--Name, Surname, Email, DOB, Password, Confirm password-->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../CSS/Register.css" />
  <script src="../javascript/script.js"></script>
</head>
<body>
    <div class = "register container">
        <h1>Create an Account</h1>

        <form action="../PHP/register.php" method="POST">
    <label>Firstname</label>
    <input type="text" name="firstname" required/>

    <label>Date of Birth</label>
    <input type="date" name="dob" required/>

    <label>Email</label>
    <input type="text" name="Email" placeholder="Enter valid email address" required/>

    <label>Password</label>
    <div class="password-wrapper">
        <input type="password" name="Password" placeholder="Enter password" required/>
        <span class="toggle"></span>
    </div>

    <label> Confirm Password </label>
    <div class="password-wrapper">
        <input type="password" name="Confirm-Password" placeholder="Re-enter Password" required/>
        <span class="toggle"></span>
    </div>

    <button type="submit">Create Account</button>
</form>

    </div>
</body>
</html>
