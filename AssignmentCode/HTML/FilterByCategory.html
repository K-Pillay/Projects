<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Filter page</title>
  <link rel="stylesheet" href="../CSS/Filter.css" />
  <script>
    function applyFilter() {
      const filters = document.getElementsByName("filter");
      let selected = "";
      for (const filter of filters) {
        if (filter.checked) {
          selected = filter.value;
          break;
        }
      }
      if (selected) {
        // Redirects back to viewAll.html with filter as a query parameter
        window.location.href = `viewAll.html?filter=${encodeURIComponent(selected)}`;
      } else {
        alert("Please select a filter option.");
      }
    }
  </script>
</head>
<body>

  <div class="filter-container">
    <div class="filter-header">
      <a href="viewAll.html" class="back-link">&larr;</a><span>Filter by</span>
    </div>

    <!-- Filter options -->
    <label class="filter-options">
      <input type="radio" name="filter" value="electronics" /> Electronics
    </label>
    <label class="filter-options">
      <input type="radio" name="filter" value="gardening" /> Gardening
    </label>
    <label class="filter-options">
      <input type="radio" name="filter" value="beauty" /> Beauty
    </label>
  </div>

  <div class="C-Button">
    <button class="confirm-button" onclick="applyFilter()">Confirm my Choices</button>
  </div>

</body>
</html>

<!--Filter logic can be improved by adding data categories to the products on the view all-->
